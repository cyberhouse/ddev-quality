# #ddev-generated

# Web server of the test instance ("ddev qa acceptance"): the apache of the ddev web image with its modules, so the
# .htaccess of the project applies as on the servers. PHP runs in the php-fpm of php-fpm.conf, both started by
# .ddev/quality/qa with the paths of the run (QA_*).
ServerRoot /etc/apache2
ServerName web:8000
Listen 8000
PidFile ${QA_RUN}/apache.pid
ErrorLog ${QA_LOG}
LogLevel warn
# only relevant when started as root (pipeline): the workers only serve files, php runs in php-fpm
User www-data
Group www-data

IncludeOptional /etc/apache2/mods-enabled/*.load
IncludeOptional /etc/apache2/mods-enabled/*.conf

# https like ddev and the servers (redirects, secure cookies), with the certificate of the run
SSLEngine on
SSLCertificateFile ${QA_RUN}/web.crt
SSLCertificateKeyFile ${QA_RUN}/web.key

DocumentRoot ${QA_INSTANCE}
<Directory ${QA_INSTANCE}>
    AllowOverride All
    Require all granted
    DirectoryIndex index.php index.html
</Directory>

<FilesMatch "\.php$">
    <If "-f %{REQUEST_FILENAME}">
        SetHandler "proxy:unix:${QA_RUN}/php-fpm.sock|fcgi://localhost"
    </If>
</FilesMatch>
