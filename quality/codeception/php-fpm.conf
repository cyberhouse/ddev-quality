; #ddev-generated

; PHP of the test instance ("ddev qa acceptance"), behind the apache of apache.conf - started by .ddev/quality/qa
; with the paths of the run (QA_*) and the environment of the instance (TYPO3_CONTEXT, TYPO3_PATH_*)
[global]
pid = ${QA_RUN}/php-fpm.pid
error_log = ${QA_LOG}

[acceptance]
user = ${QA_USER}
listen = ${QA_RUN}/php-fpm.sock
listen.mode = 0666
pm = static
pm.max_children = 4
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
